apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: orchid-ingress
  annotations:
    cert-manager.io/cluster-issuer: lets-encrypt
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/websocket-services: "orchid-api-gateway-service"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - stag.botanicsoft.com
      secretName: orchid-stag-tls
  rules:
    - host: stag.botanicsoft.com
      http:
        paths:
          - path: /orchid
            pathType: Prefix
            backend:
              service:
                name: orchid-api-gateway-service
                port:
                  number: 8080